# Фрагмент конфигурации Nginx для увеличения лимита загрузки файлов
#
# Ошибка 413 Request Entity Too Large возникает, когда размер загружаемого
# файла превышает client_max_body_size. По умолчанию Nginx ограничивает 1 МБ.
#
# ИНСТРУКЦИЯ ДЛЯ РОМЫ:
# 1. Открыть конфиг nginx (обычно /etc/nginx/sites-available/default или аналог)
# 2. Добавить в блок server { }:
#
#    client_max_body_size 10M;
#
# 3. Проверить конфиг: sudo nginx -t
# 4. Перезагрузить: sudo systemctl reload nginx
#
# В Django (config/settings.py) лимит уже установлен на 10 МБ.
